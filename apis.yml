apis:
- aid: arcadia-power:arcadia-connect-api
  name: Arcadia Connect API
  tags:
  - Energy
  - Utility Data
  - Authentication
  - Credentials
  - Onboarding
  humanURL: https://docs.arcadia.com/docs/connect-guide
  properties:
  - url: https://docs.arcadia.com/docs/connect-guide
    type: Documentation
  description: >-
    Arcadia Connect is a hosted credential-collection web experience that handles utility account onboarding
    — credential capture, MFA flows, one-time passcodes, and credential refresh — without requiring partners
    to handle utility passwords directly. The accompanying Connect API generates encoded session URLs
    and exposes credential lifecycle endpoints (create, update, refresh, disable).
- aid: arcadia-power:arcadia-signal-api
  name: Arcadia Signal API
  tags:
  - Energy
  - Utility Data
  - Tariff
  - Rates
  - Real-Time
  humanURL: https://docs.arcadia.com/v2022-12-21-Signal/docs/quick-start
  properties:
  - url: https://docs.arcadia.com/v2022-12-21-Signal/docs/quick-start
    type: Documentation
  description: >-
    Arcadia Signal provides utility tariff and energy rate data and calculations for use in cost-benefit
    analyses, bill audits, project forecasting, and financial modeling. Signal powers the Tariff & Energy
    Rate Calculator product and supports customers building solar, storage, EV charging, and demand-response
    economics.
- aid: arcadia-power:arcadia-webhooks-api
  name: Arcadia Webhooks API
  tags:
  - Energy
  - Webhook
  - Event
  - Notification
  tags_raw:
  - Energy
  - Webhooks
  - Events
  - Notifications
  humanURL: https://docs.arcadia.com/reference/list-webhooks
  properties:
  - url: https://docs.arcadia.com/reference/list-webhooks
    type: Documentation
  description: >-
    List, retrieve, and resend webhooks for asynchronous Plug platform events including statement availability,
    meter activation, interval data readiness, and credential lifecycle changes. Arcadia recommends webhooks
    over polling for production integrations.
